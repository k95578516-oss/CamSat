spring:
  flyway:
    # Local dev only: adopt an existing non-empty cam_sat schema at version 1.
    # Ensure its tables already match V1__initial_schema.sql before enabling this.
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cam_sat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:camsat}
    password: ${DB_PASSWORD:camsat_dev_password}

camsat:
  jwt:
    allow-ephemeral-secret: true

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}