# Common configuration
spring:
  application:
    name: camsat-backend

  profiles:
    default: dev

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    build:
      enabled: true

camsat:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    allow-ephemeral-secret: false

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  simulation:
    sample-delay-ms: 25
    core-threads: 2
    max-threads: 4
    queue-capacity: 20

  telemetry:
    max-rows: 20000